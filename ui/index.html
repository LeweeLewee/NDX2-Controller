<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NDX2 — Controller prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17191a;color:#eee9df;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-content:center;padding:24px}button,input{font:inherit}button{cursor:pointer;border:1px solid #55564f;background:#30332f;color:inherit;border-radius:12px;min-height:44px;padding:10px 16px}button:hover{background:#45483f}button:focus-visible,input:focus-visible{outline:3px solid #e2c799;outline-offset:2px}button:disabled{opacity:.45;cursor:default}.primary{background:#d7bd90;color:#242820;border:0}.primary:hover{background:#ecd3ab}.shell{width:800px;height:480px;background:#252824;border-radius:24px;border:1px solid #55574e;box-shadow:0 24px 90px #0008;overflow:hidden;display:grid;grid-template-rows:48px 1fr 58px;position:relative}.top{display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #43463d;font-size:12px;letter-spacing:2px}.brand{font-weight:700}.top span:last-child{letter-spacing:1px;color:#c6c5b6}.content{padding:18px 24px;overflow:auto}.nav{display:flex;border-top:1px solid #43463d;gap:8px;padding:6px 16px}.nav button{flex:1;border:0;background:transparent;color:#b3b7a9;border-radius:8px}.nav button.active{background:#40453a;color:#f6dfb5}.now{display:grid;grid-template-columns:270px 1fr;gap:28px;height:100%;align-items:center}.art{height:270px;border-radius:14px;position:relative;background:radial-gradient(ellipse at 50% 35%,#778071 0%,#3b473e 35%,#151e1b 70%);overflow:hidden;display:flex;align-items:end;padding:22px;font-size:11px;letter-spacing:2px;color:#b8c2ae}.art:before{content:'';position:absolute;width:170px;height:170px;border:1px solid #c3c5a35c;border-radius:50%;left:50px;top:36px;box-shadow:0 0 0 20px #ccd6b00b,0 0 0 40px #ccd6b009}.eyebrow{font-size:11px;letter-spacing:2px;color:#cbb68f;margin:0 0 10px}h1{font-size:32px;line-height:1.12;margin:0 0 12px;font-weight:500;overflow-wrap:anywhere}h2{font-size:24px;margin:0 0 8px;font-weight:500}.muted{color:#b2b6a8;font-size:14px;line-height:1.5}.controls{display:flex;gap:10px;margin:22px 0 10px}.controls button{min-width:58px;font-size:19px}.controls .primary{min-width:110px}.trackline{height:3px;background:#565a4d;margin-top:20px}.trackline span{display:block;height:100%;background:#d9c099}.time{display:flex;justify-content:space-between;font-size:11px;color:#afb3a7;margin-top:7px}.search{display:flex;gap:8px;margin-bottom:10px}input{min-width:0;flex:1;background:#191d19;border:1px solid #696e5d;border-radius:11px;color:#f2eadb;padding:10px 14px;height:46px}.filters{display:flex;gap:8px;margin-bottom:10px}.filters button{padding:5px 14px;min-height:40px;font-size:13px}.filters .selected{border-color:#d9c099;color:#f6dbac}.rows{display:flex;flex-direction:column;gap:6px}.row{display:flex;text-align:left;align-items:center;gap:14px;width:100%;padding:9px 12px;background:#2d322b;min-height:56px}.row .number{color:#b7ac8f;width:24px;font-size:12px}.row .label{flex:1;min-width:0}.row b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:#b1b7a8;font-size:12px}.row .arrow{color:#d3bd96}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.heading h2{margin:0}.detail{display:grid;grid-template-columns:170px 1fr;gap:24px}.detail .art{height:170px}.detail .art:before{width:110px;height:110px;top:20px;left:28px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.detailrows{margin-top:14px}.note{max-width:800px;font-size:13px;line-height:1.6;color:#b3b6ad;margin-top:22px}.note strong{color:#e0d8c7;font-weight:500}.toast{position:absolute;left:20px;right:20px;bottom:64px;background:#e5d0aa;color:#252824;border-radius:10px;padding:12px 16px;font-size:13px;box-shadow:0 5px 20px #0006;z-index:5}.toast[hidden]{display:none}.empty{padding:34px 20px;text-align:center;color:#b9bfaf}.offline{color:#e1b09b!important}a{color:#ddc697}@media(max-width:850px){body{display:block;padding:12px}.shell{width:100%;height:480px}.now{grid-template-columns:38% 1fr;gap:18px}.art{width:100%;height:240px}h1{font-size:28px}}@media(max-width:550px){.shell{height:640px}.now{grid-template-columns:1fr;gap:12px}.now .art{height:130px}.content{padding:16px}.detail{grid-template-columns:1fr}.detail .art{display:none}.controls{margin:12px 0}.nav{padding:6px}.nav button{padding:8px}.top{padding:0 16px}}
.art.has-image{padding:0;background:#191d19}.art.has-image:before{display:none}.art img{width:100%;height:100%;object-fit:cover;display:block}</style><link rel="stylesheet" href="/discovery.css"></head>
<body><div class="shell"><header class="top"><span class="brand">NDX / CONTROLLER</span><span id="connection">CONNECTING</span></header><main class="content" id="view"></main><nav class="nav" aria-label="Main navigation"><button data-page="now">Now playing</button><button data-page="search">Find music</button><button data-page="collection">Collection</button><button data-page="queue">Queue <span id="count"></span></button></nav><div id="toast" class="toast" role="status" hidden></div></div><div class="note"><strong>Waveshare 4.3-inch · 800 × 480 prototype</strong><br><span id="explanation">Loading configuration…</span> Cover art is supplied by the player when available. Volume awaits amplifier validation.</div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const demo=[['tracks','161317','Teardrop','Massive Attack'],['tracks','161315','Angel','Massive Attack'],['tracks','17691649','Unfinished Sympathy','Massive Attack'],['albums','161314','Mezzanine','Massive Attack'],['albums','17691643','Blue Lines','Massive Attack'],['artists','9056','Massive Attack','Artist'],['playlists','e068f4c7-b915-4e6a-a3e3-84a029c8f28d','Massive Attack Essentials','TIDAL']].map(([kind,id,title,artist])=>({kind,reference:`inputs/tidal/${kind}/${id}`,title,artist}));
let config={live:false,catalog:false}, page='now',kind='tracks',query='Massive Attack',results=[],queue=[],selected=null,children=[],playable=false,offset=0,browseRef='',cursor=null,resultId=null,busy=false,noticeTimer;
let history=[];
let state={title:'Teardrop',artist:'Massive Attack',album:'Mezzanine',state:'paused',duration:330000,transportPosition:76000,sourceDetail:'tidal'};
function notice(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('#toast').hidden=true,5500)}
async function api(action,args={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,args})});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function connection(ok=true){$('#connection').textContent=config.live?(ok?'NDX 2 · LIVE':'NDX 2 · OFFLINE'):(config.catalog?'LIVE CATALOGUE · DEMO PLAYER':'DEMO · NO DEVICE CONTROL');$('#connection').className=ok?'':'offline'}
function rows(items){return items.map((i,n)=>`<button class="row" data-select="${n}"><span class="number">${String(n+1).padStart(2,'0')}</span><span class="label"><b>${esc(i.title)}</b><small>${esc(i.artist||i.kind)}</small></span><span class="arrow">↗</span></button>`).join('')||'<div class="empty">No items to show.</div>'}
function art(item){const url=item?.artwork;return typeof url==='string'&&/^\/artwork\/[a-f0-9]{64}\.jpg$/.test(url)?`<div class="art has-image"><img src="${esc(url)}" alt="Cover art for ${esc(item.album||item.title||'this selection')}"><span hidden>Cover unavailable</span></div>`:'<div class="art" aria-label="No cover available">NDX / MUSIC</div>'}
document.addEventListener('error',e=>{if(e.target.matches?.('.art img')){const box=e.target.parentElement;e.target.remove();box.classList.remove('has-image');box.querySelector('span').hidden=false}},true);
function time(ms){let s=Math.max(0,Math.floor(Number(ms||0)/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#count').textContent=queue.length||'';
 if(page==='now')$('#view').innerHTML=`<div class="now">${art(state)}<section><p class="eyebrow">${esc(state.sourceDetail||'PLAYER')} · ${esc(state.state)}</p><h1>${esc(state.title||'Nothing playing')}</h1><div class="muted">${esc(state.artist||state.artistName||'')}<br>${esc(state.album||'')}</div><div class="trackline"><span style="width:${Math.min(100,Math.max(0,Number(state.transportPosition||0)/Math.max(1,Number(state.duration||0))*100))}%"></span></div><div class="time"><span>${time(state.transportPosition)}</span><span>${time(state.duration)}</span></div><div class="controls"><button data-transport="prev" aria-label="Previous track">‹</button><button class="primary" data-transport="${state.state==='playing'?'pause':'resume'}">${state.state==='playing'?'Pause':'Play'}</button><button data-transport="next" aria-label="Next track">›</button><button data-transport="stop" aria-label="Stop playback">□</button></div><span class="muted">${config.live?'Player-reported state':'Demo playback · no audio'}</span></section></div>`;
 if(page==='search')$('#view').innerHTML=`<form class="search"><input aria-label="Search TIDAL" value="${esc(query)}" maxlength="256" placeholder="Artist, album or song" required><button class="primary" type="submit">Search</button></form><div class="filters">${['tracks','albums','artists','playlists'].map(k=>`<button data-kind="${k}" class="${kind===k?'selected':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div><div class="rows">${rows(results)}</div>${cursor?'<button data-more="search">More results</button>':''}`;
 if(page==='collection')$('#view').innerHTML=`<div class="heading"><h2>Your collection</h2><button data-refresh="collection">Refresh</button></div><div class="rows">${rows(results)}</div><p class="muted">${config.live?'Favourites returned by your Naim player.':'Demo collection. Connect at home to browse Naim favourites.'}</p>`;
 if(page==='queue')$('#view').innerHTML=`<div class="heading"><h2>Play queue <span class="muted">${queue.length} items</span></h2><button data-refresh="queue">Refresh</button></div><div class="rows">${queue.length?queue.map((i,n)=>`<div class="row"><span class="number">${n+1}</span><span class="label"><b>${esc(i.title)}</b><small>${esc(i.artist)}</small></span></div>`).join(''):'<div class="empty">Your next listening session starts here.<br>Find music and add it to the queue.</div>'}</div>`;
 if(page==='detail'&&selected)$('#view').innerHTML=`<div class="heading"><button data-back>← Back</button><span class="eyebrow">${esc(selected.kind)}</span></div><div class="detail">${art(selected)}<section><h2>${esc(selected.title)}</h2><div class="muted">${esc(selected.artist)}</div><div class="actions">${playable?'<button class="primary" data-play="replace">Play now</button><button data-play="next">Play next</button><button data-play="last">Add to queue</button>':'<span class="muted">Choose an item below. Playback requires a resolved native item.</span>'}</div></section></div><div class="rows detailrows">${children.length?rows(children):''}</div>${children.length===20?'<button data-more="browse">Next page</button>':''}`;
 if(busy)$('#view').querySelectorAll('button').forEach(b=>b.disabled=true);
}
async function search(more=false){if(config.catalog){const data=await api('search',more?{kind,result_id:resultId,cursor}:{query,kind});results=more?results.concat(data.items):data.items;cursor=data.cursor;resultId=data.result_id}else{results=demo.filter(i=>i.kind===kind&&`${i.title} ${i.artist}`.toLowerCase().includes(query.toLowerCase()));cursor=null}render()}
async function refresh(){if(config.live){try{state=await api('status');connection(true)}catch(e){connection(false);throw e}}if(page==='now')render()}
async function loadQueue(){if(config.live)queue=(await api('queue')).items;if(page==='queue')render()}
async function collection(){results=config.live?(await api('browse')).items:demo.filter(i=>i.kind==='albums'||i.kind==='playlists');render()}
async function select(item,more=false){if(!item?.reference){notice('This item has no usable native reference.');return}const previous={page,selected,children,playable,results,offset,browseRef};selected=item;playable=false;children=[];browseRef=item.reference;offset=more?offset+20:0;
 if(config.live){const data=await api('browse',{reference:browseRef,offset});playable=data.playable;children=data.items;selected={...item,...data.item,title:data.item.title==='Untitled'?item.title:data.item.title}}
 else{playable=['tracks','albums','playlists'].includes(item.kind);children=item.kind==='artists'?demo.filter(i=>i.kind==='albums'):item.kind==='tracks'?[]:demo.filter(i=>i.kind==='tracks'&&(item.kind==='playlists'||(item.title==='Mezzanine'?i.title!=='Unfinished Sympathy':i.title==='Unfinished Sympathy')))}
 if(!more)history.push(previous);page='detail';render()}
async function play(placement){if(config.live){notice((await api('play',{reference:selected.reference,placement})).message);page=placement==='replace'?'now':'queue';await refresh();await loadQueue()}
 else{let additions=selected.kind==='tracks'?[selected]:children.filter(i=>i.kind==='tracks');if(placement==='replace'){queue=additions.slice();const first=queue[0];if(first)state={...state,...first,state:'playing',transportPosition:0};page='now'}else{queue=placement==='next'?[...queue.slice(0,1),...additions,...queue.slice(1)]:queue.concat(additions);notice('Added to demo queue');} }render()}
async function transport(command){if(config.live){notice((await api('transport',{command})).message);await refresh()}else{if(command==='pause')state.state='paused';if(command==='resume')state.state='playing';if(command==='stop'){state.state='stopped';state.transportPosition=0}if(command==='next'||command==='prev'){const idx=queue.findIndex(i=>i.reference===state.reference);const next=queue[idx+(command==='next'?1:-1)];if(next)state={...state,...next,state:'playing',transportPosition:0};else notice('No '+(command==='next'?'next':'previous')+' item in the demo queue.')}render()}}
async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){notice(e.message)}finally{busy=false;render()}}
document.addEventListener('submit',e=>{if(e.target.matches('.search')){e.preventDefault();query=e.target.querySelector('input').value.trim();run(()=>search())}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.matches('[data-discovery],[data-voice],[data-cancel-voice],[data-new-brief],[data-explore],#discovery-form button'))return;run(async()=>{if(b.dataset.page){history=[];page=b.dataset.page;if(page==='collection')await collection();if(page==='search')await search();if(page==='queue')await loadQueue();if(page==='now')await refresh();render()}else if(b.dataset.kind){query=$('input')?.value||query;kind=b.dataset.kind;await search()}else if(b.dataset.select!==undefined){await select((page==='detail'?children:results)[Number(b.dataset.select)])}else if(b.hasAttribute('data-back')){const previous=history.pop();if(previous)({page,selected,children,playable,results,offset,browseRef}=previous);else page='search';render()}else if(b.dataset.play){await play(b.dataset.play)}else if(b.dataset.transport){await transport(b.dataset.transport)}else if(b.dataset.refresh==='queue'){await loadQueue()}else if(b.dataset.refresh==='collection'){await collection()}else if(b.dataset.more==='search'){await search(true)}else if(b.dataset.more==='browse'){await select(selected,true)}})});
async function start(){try{const response=await fetch('/api/config');if(!response.ok)throw Error('Configuration unavailable');config=await response.json();connection();$('#explanation').textContent=config.live?'Live controls use the configured NDX. Search candidates must resolve through native Naim browsing before playback.':config.catalog?'Search uses live TIDAL metadata. Playback and queue are simulated; no NDX is connected.':'Interactive demo: search Massive Attack, open an album, play or queue tracks. No service credentials or NDX connection needed.';if(config.live)state={state:'unknown'};render();await refresh()}catch(e){notice(e.message);connection(false)}}start();setInterval(()=>{if(config.live&&!busy&&page==='now')run(refresh)},5000);
</script><script src="/discovery.js"></script></body></html>
