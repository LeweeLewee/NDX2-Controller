<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="0 0 210 148"><rect width="210" height="148" fill="white"/><g font-family="Arial" fill="black"><text x="12" y="12" font-size="5">01 River Stone — iPhone 11 aperture registration</text><text x="12" y="21" font-size="3.5">Print at 100%, no fit-to-page. Verify the 50 mm scale before use.</text><rect x="29.55" y="33" width="150.9" height="75.7" rx="8" fill="none" stroke="#777" stroke-width=".3" stroke-dasharray="2 1"/><rect x="36.05" y="39.5" width="137.9" height="62.7" fill="none" stroke="black" stroke-width=".4"/><text x="80" y="70" font-size="5">CUT WINDOW</text><text x="76" y="78" font-size="4">137.9 × 62.7 mm</text><text x="13" y="31" font-size="3">6.5 mm overlap all edges. Notch LEFT; phone corners approximate.</text><path d="M12 124 H62 M12 121 V127 M62 121 V127" stroke="black" stroke-width=".4"/><text x="29" y="132" font-size="4">50 mm</text><text x="77" y="119" font-size="3.3">Hold above phone; do not tape across openings.</text><text x="77" y="126" font-size="3.3">Visual registration only. Remove for microphone tests.</text><text x="77" y="133" font-size="3.3">Not a cradle template or microphone-position drawing.</text></g></svg>