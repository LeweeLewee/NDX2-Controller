<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f4f1e9"/><g font-family="Segoe UI,Arial" fill="#293737"><text x="40" y="45" font-size="28">iPhone inside the stone / proposed interface</text><text x="40" y="78" font-size="17">Architecture discussion — schematic, not a fabrication drawing</text><text x="40" y="125" font-size="22">Front: phone outline concealed</text><rect x="65" y="150" width="453" height="227" rx="36" fill="#bdb5a2"/><rect x="75" y="161" width="432" height="205" rx="30" fill="none" stroke="#6d746f" stroke-dasharray="7 5"/><rect x="115" y="183" width="354" height="162" rx="8" fill="#25393c"/><text x="194" y="260" fill="#eee9dc" font-size="22">118 × 54 mm</text><text x="181" y="289" fill="#eee9dc" font-size="16">provisional visible window</text><text x="65" y="410" font-size="17">Phone body: 150.9 × 75.7 mm in landscape</text><text x="65" y="439" font-size="16">Notch at left, connector at right — hidden in body</text><text x="625" y="125" font-size="22">Section through one aperture edge</text><path d="M625 165 L735 165 Q760 165 780 200 L825 265 L870 285 L870 303 L625 303 Z" fill="#bdb5a2" stroke="#847d6c"/><rect x="815" y="303" width="55" height="7" fill="#202a2b"/><rect x="652" y="315" width="480" height="8" rx="2" fill="#52787c"/><rect x="652" y="323" width="480" height="55" rx="8" fill="#8b9596"/><path d="M640 325 L650 325 L650 385 L780 385 L780 397 L640 397 Z" fill="#687d68"/><rect x="670" y="378" width="80" height="7" fill="#303b36"/><path d="M1000 235 L850 290 M1000 286 L853 307 M1000 420 L750 392" fill="none" stroke="#495b58"/><text x="966" y="218" font-size="17">Opaque stone lip</text><text x="960" y="278" font-size="16">Hidden black gasket</text><text x="891" y="354" font-size="17">Intact iPhone</text><text x="861" y="454" font-size="17">Padded, removable cradle</text><text x="660" y="494" font-size="16">Screw stops bear on cradle, not glass or battery.</text><text x="40" y="554" font-size="20">Visible: stone → shallow dark joint → phone glass → UI</text><text x="40" y="587" font-size="17">No extra cover glass. Mask the notch optically; keep touch targets inside the usable window.</text><text x="40" y="620" font-size="17">Load and service from underneath. Exact aperture, recess and pad dimensions await a physical mask trial.</text><text x="40" y="651" font-size="15">UGREEN bank sits separately, low in the base; battery bay and plug clearances require a fresh layout.</text></g></svg>