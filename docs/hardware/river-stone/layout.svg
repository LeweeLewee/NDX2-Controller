<text x="865" y="694" font-family="Segoe UI, sans-serif" font-size="19" fill="#283336">3 mm underside cover / low battery / no dock</text>
<text x="55" y="778" font-family="Segoe UI, sans-serif" font-size="23" fill="#283336">CONSTRUCTION</text>
<text x="55" y="814" font-family="Segoe UI, sans-serif" font-size="20" fill="#283336">Main shell + recessed underside cover; screen supports and battery restraint still to detail.</text>
<text x="55" y="849" font-family="Segoe UI, sans-serif" font-size="20" fill="#283336">Target flat underside joint, reusable screws, non-slip feet and discreet rear charging access.</text>
<text x="55" y="884" font-family="Segoe UI, sans-serif" font-size="20" fill="#283336">Side section is illustrative: preserve the asymmetry and soft shoulders of original 01 during surfacing.</text>
<text x="55" y="955" font-family="Segoe UI, sans-serif" font-size="23" fill="#283336">CHECKED</text>
<text x="55" y="990" font-family="Segoe UI, sans-serif" font-size="20" fill="#283336">Reserved boxes do not overlap; fit within a 3 mm inset footprint; clear the inclined screen rear plane.</text>
<text x="55" y="1026" font-family="Segoe UI, sans-serif" font-size="20" fill="#283336">Not yet checked: full shell, cables, mounting, antenna, microphone, thermal behaviour or print supports.</text>
<text x="55" y="1060" font-family="Segoe UI, sans-serif" font-size="18" fill="#283336">Source: Waveshare 4.3B manufacturer drawing. Concept dimensions and component bays remain provisional.</text>
